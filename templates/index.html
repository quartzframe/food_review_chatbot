<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieBot - Food Review Chatbot</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 196, 80, .25), transparent 35%),
                linear-gradient(135deg, #fff8ef, #ffe8d2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #2b2118;
        }
        .app {
            width: min(950px, 100%);
            height: min(760px, 92vh);
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,.86);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,.8);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(83, 47, 19, .18);
        }
        header {
            padding: 22px 26px;
            background: linear-gradient(135deg, #ff7a18, #ff3d54);
            color: white;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo {
            width: 52px; height: 52px; border-radius: 16px;
            display: grid; place-items: center; font-size: 27px;
            background: rgba(255,255,255,.2);
        }
        header h1 { margin: 0; font-size: 23px; }
        header p { margin: 4px 0 0; opacity: .9; font-size: 13px; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 78%;
            padding: 13px 16px;
            border-radius: 18px;
            white-space: pre-wrap;
            line-height: 1.5;
            animation: pop .2s ease;
        }
        .bot {
            align-self: flex-start;
            background: #fff3e4;
            border-bottom-left-radius: 5px;
        }
        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #ff6b35, #ff3d54);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .quick {
            padding: 0 25px 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .quick button {
            border: 1px solid #ffd0b4;
            background: #fff8f2;
            color: #d94f1f;
            border-radius: 999px;
            padding: 8px 13px;
            cursor: pointer;
            font-weight: 600;
        }
        .quick button:hover { background: #ffe8d7; }
        form {
            display: flex;
            gap: 10px;
            padding: 18px 22px 22px;
            border-top: 1px solid #f1e1d5;
            background: rgba(255,255,255,.8);
        }
        input {
            flex: 1;
            border: 1px solid #e8d6c8;
            outline: none;
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 15px;
            background: white;
        }
        input:focus { border-color: #ff6b35; box-shadow: 0 0 0 3px rgba(255,107,53,.12); }
        #send {
            border: 0;
            border-radius: 16px;
            padding: 0 20px;
            background: #ff5a36;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        #send:disabled { opacity: .6; cursor: wait; }
        @keyframes pop { from { transform: translateY(5px); opacity: 0; } to { transform: none; opacity: 1; } }
        @media (max-width: 600px) {
            .app { height: 94vh; border-radius: 20px; }
            .message { max-width: 90%; }
            form { padding: 13px; }
            #send { padding: 0 15px; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="logo">🍔</div>
        <div>
            <h1>FoodieBot</h1>
            <p>Your friendly food review assistant</p>
        </div>
    </header>

    <main id="chat"></main>

    <div class="quick">
        <button onclick="quickAsk('Review biryani')">🍛 Biryani</button>
        <button onclick="quickAsk('Review pizza')">🍕 Pizza</button>
        <button onclick="quickAsk('Review burger')">🍔 Burger</button>
        <button onclick="quickAsk('Review dosa')">🥞 Dosa</button>
        <button onclick="quickAsk('Review noodles')">🍜 Noodles</button>
    </div>

    <form id="form">
        <input id="message" autocomplete="off" placeholder="Ask for a food review..." />
        <button id="send" type="submit">Send</button>
    </form>
</div>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("message");
const send = document.getElementById("send");

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = `message ${type}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function quickAsk(text) {
    input.value = text;
    form.requestSubmit();
}

async function sendMessage(message) {
    addMessage(message, "user");
    send.disabled = true;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message})
        });
        const data = await response.json();
        addMessage(data.reply, "bot");
    } catch (error) {
        addMessage("Sorry, I couldn't connect to the chatbot server.", "bot");
    } finally {
        send.disabled = false;
        input.focus();
    }
}

form.addEventListener("submit", (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    sendMessage(message);
});

addMessage(
    "Hi! 👋 I’m FoodieBot.\n\nAsk me for a review or rating of pizza, burger, biryani, dosa, noodles, or ice cream.",
    "bot"
);
</script>
</body>
</html>
